<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile Send UI Check</title>
    <style>
      body {
        margin: 0;
        background: #f4f4f5;
        color: #18181b;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0 0 18px;
        color: #52525b;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        align-items: start;
      }

      figure {
        margin: 0;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }

      figcaption {
        border-bottom: 1px solid #e4e4e7;
        padding: 10px 12px;
        font-weight: 600;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mobile Send UI Check</h1>
      <p>Android 412 x 915 send-message interaction screenshots.</p>
      <div class="grid">
        <figure>
          <figcaption>Before Send</figcaption>
          <img src="./before-send.png" alt="Before send screenshot" />
        </figure>
        <figure>
          <figcaption>Typed Before Click</figcaption>
          <img src="./typed-before-click.png" alt="Typed before click screenshot" />
        </figure>
        <figure>
          <figcaption>After Send</figcaption>
          <img src="./after-send.png" alt="After send screenshot" />
        </figure>
      </div>
    </main>
  </body>
</html>
