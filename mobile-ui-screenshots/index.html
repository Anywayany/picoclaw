<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile UI Screenshots</title>
    <style>
      body {
        margin: 0;
        background: #f4f4f5;
        color: #18181b;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 22px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        align-items: start;
      }

      figure {
        margin: 0;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }

      figcaption {
        border-bottom: 1px solid #e4e4e7;
        padding: 10px 12px;
        font-weight: 600;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mobile UI Screenshots</h1>
      <div class="grid">
        <figure>
          <figcaption>iPhone SE - 375 x 667</figcaption>
          <img src="./iphone-se.png" alt="iPhone SE mobile UI screenshot" />
        </figure>
        <figure>
          <figcaption>iPhone 13 - 390 x 844</figcaption>
          <img src="./iphone-13.png" alt="iPhone 13 mobile UI screenshot" />
        </figure>
        <figure>
          <figcaption>Pixel 7 - 412 x 915</figcaption>
          <img src="./pixel-7.png" alt="Pixel 7 mobile UI screenshot" />
        </figure>
      </div>
    </main>
  </body>
</html>
