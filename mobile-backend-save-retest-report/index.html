<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PicoClaw Mobile UI Retest Report</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f6f7f9;
        color: #15171a;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.25;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }

      .meta {
        margin: 0 0 20px;
        color: #667085;
        font-size: 14px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        margin-bottom: 24px;
      }

      .pill {
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #fff;
        padding: 10px 12px;
        font-size: 14px;
      }

      .ok {
        border-color: #a6f4c5;
        background: #ecfdf3;
        color: #05603a;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #fff;
      }

      figcaption {
        border-bottom: 1px solid #eaecf0;
        padding: 10px 12px;
        font-weight: 600;
        font-size: 14px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }

      a {
        color: #155eef;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111418;
          color: #f4f4f5;
        }

        .meta {
          color: #a1a1aa;
        }

        .pill,
        figure {
          border-color: #343a40;
          background: #181c20;
        }

        .ok {
          border-color: #05603a;
          background: #052e1a;
          color: #86efac;
        }

        figcaption {
          border-bottom-color: #343a40;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PicoClaw Mobile UI Retest Report</h1>
      <p class="meta">
        Pixel 7 viewport 412x915. Full JSON:
        <a href="./report.json">report.json</a>
      </p>

      <section class="summary" aria-label="Test summary">
        <div class="pill ok">Multi-turn text: passed</div>
        <div class="pill ok">Attachment UI: passed</div>
        <div class="pill ok">Attachment saved: passed</div>
        <div class="pill ok">Saved bytes match: passed</div>
        <div class="pill ok">Attachment reply: passed</div>
        <div class="pill ok">No image-model error</div>
        <div class="pill ok">No horizontal overflow</div>
      </section>

      <h2>Screenshots</h2>
      <section class="grid">
        <figure>
          <figcaption>Initial mobile page</figcaption>
          <img src="./initial.png" alt="Initial mobile page screenshot" />
        </figure>
        <figure>
          <figcaption>Turn 1 reply</figcaption>
          <img src="./turn-1.png" alt="Turn 1 reply screenshot" />
        </figure>
        <figure>
          <figcaption>Turn 2 reply</figcaption>
          <img src="./turn-2.png" alt="Turn 2 reply screenshot" />
        </figure>
        <figure>
          <figcaption>Turn 3 reply</figcaption>
          <img src="./turn-3.png" alt="Turn 3 reply screenshot" />
        </figure>
        <figure>
          <figcaption>Attachment selected</figcaption>
          <img src="./attachment-selected.png" alt="Attachment selected screenshot" />
        </figure>
        <figure>
          <figcaption>Attachment saved and replied</figcaption>
          <img src="./attachment-after-send.png" alt="Attachment saved and replied screenshot" />
        </figure>
      </section>
    </main>
  </body>
</html>
