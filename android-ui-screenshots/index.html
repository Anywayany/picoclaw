<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Android Mobile UI Screenshots</title>
    <style>
      body {
        margin: 0;
        background: #f4f4f5;
        color: #18181b;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1320px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0 0 18px;
        color: #52525b;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        align-items: start;
      }

      figure {
        margin: 0;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }

      figcaption {
        border-bottom: 1px solid #e4e4e7;
        padding: 10px 12px;
        font-weight: 600;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Android Mobile UI Screenshots</h1>
      <p>Portrait-only Android viewport checks for /mobile.</p>
      <div class="grid">
        <figure>
          <figcaption>Android 360 x 740</figcaption>
          <img src="./android-360x740.png" alt="Android 360 by 740 screenshot" />
        </figure>
        <figure>
          <figcaption>Android 360 x 800</figcaption>
          <img src="./android-360x800.png" alt="Android 360 by 800 screenshot" />
        </figure>
        <figure>
          <figcaption>Android 384 x 854</figcaption>
          <img src="./android-384x854.png" alt="Android 384 by 854 screenshot" />
        </figure>
        <figure>
          <figcaption>Android 393 x 873</figcaption>
          <img src="./android-393x873.png" alt="Android 393 by 873 screenshot" />
        </figure>
        <figure>
          <figcaption>Android 412 x 915</figcaption>
          <img src="./android-412x915.png" alt="Android 412 by 915 screenshot" />
        </figure>
        <figure>
          <figcaption>Android 432 x 960</figcaption>
          <img src="./android-432x960.png" alt="Android 432 by 960 screenshot" />
        </figure>
        <figure>
          <figcaption>Android 480 x 1067</figcaption>
          <img src="./android-480x1067.png" alt="Android 480 by 1067 screenshot" />
        </figure>
      </div>
    </main>
  </body>
</html>
