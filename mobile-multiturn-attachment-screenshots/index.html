<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile Multiturn And Attachment Check</title>
    <style>
      body {
        margin: 0;
        background: #f4f4f5;
        color: #18181b;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1320px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0 0 18px;
        color: #52525b;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        align-items: start;
      }

      figure {
        margin: 0;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }

      figcaption {
        border-bottom: 1px solid #e4e4e7;
        padding: 10px 12px;
        font-weight: 600;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mobile Multiturn And Attachment Check</h1>
      <p>Android 412 x 915: text turns and image attachment send flow.</p>
      <div class="grid">
        <figure>
          <figcaption>Initial</figcaption>
          <img src="./initial.png" alt="Initial screenshot" />
        </figure>
        <figure>
          <figcaption>Turn 1</figcaption>
          <img src="./turn-1.png" alt="Turn 1 screenshot" />
        </figure>
        <figure>
          <figcaption>Turn 2</figcaption>
          <img src="./turn-2.png" alt="Turn 2 screenshot" />
        </figure>
        <figure>
          <figcaption>Turn 3</figcaption>
          <img src="./turn-3.png" alt="Turn 3 screenshot" />
        </figure>
        <figure>
          <figcaption>Attachment Selected</figcaption>
          <img src="./attachment-selected.png" alt="Attachment selected screenshot" />
        </figure>
        <figure>
          <figcaption>Attachment After Send</figcaption>
          <img src="./attachment-after-send.png" alt="Attachment after send screenshot" />
        </figure>
      </div>
    </main>
  </body>
</html>
