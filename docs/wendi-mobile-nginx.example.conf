upstream picoclaw_launcher {
    server 127.0.0.1:18800;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 443 ssl http2;
    server_name picoclaw-mobile.company.com;

    location = / {
        return 404;
    }

    location = /mobile {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /mobile/ {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /assets/ {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
    }

    location = /favicon.svg {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
    }

    location = /favicon-96x96.png {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
    }

    location = /apple-touch-icon.png {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
    }

    location = /site.webmanifest {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
    }

    location = /launcher-login {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /launcher-setup {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/status {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_except POST { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/setup {
        limit_except POST { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/gateway/status {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/pico/info {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/sessions/[^/]+$ {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /pico/ws {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ^~ /pico/media/ {
        limit_except GET { deny all; }
        proxy_pass http://picoclaw_launcher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
